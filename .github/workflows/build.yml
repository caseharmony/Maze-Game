name: Build All Platforms
on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 g++

      - name: Install Python Requirements
        run: |
          pip install setuptools nuitka zstandard cython numpy
          pip install customtkinter pillow pygame pywinstyles bcrypt mysql-connector-python

      - name: Compile Cython Extensions (C++)
        run: |
          python setup.py build_ext --inplace

      - name: Build with Nuitka
        # Injecting your Repository Secrets into the Environment
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL }}
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: gui.py # Change to your main entry file
          mode: onefile
          lto: yes
          disable-console: true
          enable-plugins: tk-inter
          nofollow-import-to: "*.vendor.plugin"
          # Ensure Nuitka uses the right compiler on Windows
          mingw64: ${{ matrix.os == 'windows-latest' }}
          # Dependencies and Assets
          include-package: |
            customtkinter
            PIL
            pygame
            bcrypt
            mysql
            mysql.connector
            email
          include-module: smtplib
          include-package-data: |
            customtkinter
            mysql
            mysql.connector
          include-data-files: |
            *.mp3=./
            *.wav=./
            *.json=./
            *.png=./
            *.ico=./
            *.gif=./

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aMAZEing-${{ matrix.os }}
          path: |
            build/*.bin
            build/*.app
            build/*.exe