name: Build All Platforms
on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false 
      matrix:
        # 1. Use ubuntu-20.04 for better Linux compatibility (older GLIBC)
        os: [ubuntu-20.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 g++ libwayland-client0

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install setuptools nuitka zstandard cython numpy
          pip install customtkinter pillow pygame pywinstyles bcrypt mysql-connector-python

      - name: Compile Cython Extensions (C++)
        run: |
          python setup.py build_ext --inplace

      - name: Build with Nuitka
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL }}
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: gui.py
          # 2. 'app' mode is better for GUIs/Games to handle DPI and bundling
          mode: app 
          lto: yes
          # 3. Set to false temporarily if you still need to see startup errors
          disable-console: true 
          enable-plugins: tk-inter
          nofollow-import-to: "*.vendor.plugin"
          
          # 4. Windows Specific: Force include the CRT (C Runtime) DLLs
          mingw64: ${{ matrix.os == 'windows-latest' }}
          windows-dependency-tool: pefile
          
          # 5. macOS Specific: Create the .app bundle correctly
          macos-create-app-bundle: ${{ matrix.os == 'macos-latest' }}
          macos-app-icon: ${{ matrix.os == 'macos-latest' && 'icon.icns' || '' }}

          include-package: |
            customtkinter
            PIL
            pygame
            bcrypt
            mysql
            mysql.connector
            email
          include-module: smtplib
          include-package-data: |
            customtkinter
            mysql
            mysql.connector
            tkinter
          include-data-files: |
            *.mp3=./
            *.wav=./
            *.json=./
            *.png=./
            *.ico=./
            *.gif=./

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aMAZEing-${{ matrix.os }}
          path: |
            build/*.bin
            build/*.app
            build/*.exe
            build/*.zip